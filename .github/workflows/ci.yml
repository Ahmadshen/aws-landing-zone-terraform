name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform:
    name: fmt, validate, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.2
      - run: terraform fmt -check -recursive
      - run: make validate
      # Every module has terraform test suites against mocked AWS: no credentials in CI.
      - run: make test

  lint:
    name: tflint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make lint

  scan:
    name: trivy (IaC misconfigurations)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make scan
